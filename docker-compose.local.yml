services:
  api:
    build: .
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification:
    build: .
    command: ["./notification"]
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
